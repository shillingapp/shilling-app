/* ── CUTOVER VERIFICATION ──────────────────────────────────*/
async function fbCutoverVerify(){
  if(!FIREBASE_ENABLED||!_fbBizId)return{ok:false,reason:'Firebase not configured'};
  const ls=fbBuildReconSnapshot('localStorage');
  const fbCounts={};
  const cols=['contacts','products','docs','expenses','banks','returns',
              'purchaseReturns','adjustments','loans'];
  try{
    for(const col of cols){
      const snap=await fbCol(col).get();
      fbCounts[col]=snap.size;
    }
    // payments
    let fbPay=0;
    const docsSnap=await fbCol('docs').get();
    for(const d of docsSnap.docs){
      const ps=await fbPayCol(d.id).get();fbPay+=ps.size;
    }
    fbCounts.payments=fbPay;
    // Compare counts
    const mismatches=[];
    const map={contacts:'contacts',products:'products',docs:'docs',
               payments:'payments',expenses:'expenses',banks:'banks',
               returns:'returns',purchaseReturns:'purchaseReturns',
               adjustments:'adjustments',loans:'loans'};
    for(const [k,col] of Object.entries(map)){
      const lsV=ls[k]??0;const fbV=fbCounts[col]??0;
      if(lsV!==fbV)mismatches.push({col,ls:lsV,fb:fbV});
    }
    const ok=mismatches.length===0;
    if(ok)_cutoverStatus=CUTOVER_STATUS.MIGRATION_VERIFIED;
    return{ok,mismatches,fbCounts,lsCounts:ls};
  }catch(e){return{ok:false,error:e.message};}
}

/* ── ACTIVATE FIRESTORE PRIMARY ────────────────────────────*/
async function fbActivatePrimary(){
  if(!FIREBASE_ENABLED||!_fbBizId){
    migLog('Firebase lama habaynin');return false;
  }
  // 1. Create localStorage snapshot
  fbCreateLsSnapshot();
  migLog('📦 Snapshot abuurmay');
  // 2. Verify counts match
  migLog('🔍 Xaqiijin bilaabanayaa...');
  const verify=await fbCutoverVerify();
  if(!verify.ok){
    migLog('❌ Khilaafaad jira — cutover la joojiyay');
    (verify.mismatches||[]).forEach(m=>migLog(`  ${m.col}: LS=${m.ls} FB=${m.fb}`));
    return false;
  }
  migLog('✅ Xaqiijinta dhammaatay');
  // 3. Hydrate S from Firestore
  const hydrated=await fbHydrateFromFirestore();
  if(!hydrated){migLog('❌ Hydration failed — keeping local');return false;}
  // 4. Switch data source
  _dataSource=DS.FIRESTORE;
  _cutoverStatus=CUTOVER_STATUS.FIRESTORE_PRIMARY;
  // 5. Setup real-time listeners
  fbSetupListeners();
  // 6. Disable old blob sync
  // _fbSyncDoc listeners will still fire but we handle via collection listeners
  migLog('🔥 Firestore PRIMARY activated ✅');
  try{localStorage.setItem('xisaab_cutover',JSON.stringify({
    ts:new Date().toISOString(),status:'primary',bizId:_fbBizId
  }));}catch(e){}
  renderMigUI();render();
  return true;
}

/* ── ROLLBACK ──────────────────────────────────────────────*/
async function fbRollback(){
  if(!confirm('Dib u celi localStorage mode? Firestore xogta lama tirtirayo.'))return;
  fbUnsubscribeAll();
  _dataSource=DS.LOCAL;
  _cutoverStatus=CUTOVER_STATUS.NOT_READY;
  // Restore pre-cutover snapshot if available
  if(_lsSnapshot||localStorage.getItem('xisaab_snapshot')){
    const ok=fbRestoreLsSnapshot();
    migLog(ok?'✅ Snapshot la soo celiyay':'⚠ Snapshot ma jirin — xog localStorage ayaa la isticmaalayaa');
  }
  // Re-init blob sync (Step 2 mechanism)
  if(_fbBizId&&FIREBASE_ENABLED)fbInitFirestoreSync();
  try{localStorage.setItem('xisaab_cutover',JSON.stringify({
    ts:new Date().toISOString(),status:'rolled_back',bizId:_fbBizId
  }));}catch(e){}
  migLog('↩ Rollback dhammaatay — localStorage mode');
  renderMigUI();render();
}

/* ════ NETLIFY AI PROXY ════════════════════════════════════
 * Routes Anthropic requests through /.netlify/functions/ai
 * when running on Netlify (outside claude.ai artifact viewer).
 * The Anthropic API key exists ONLY as a Netlify env variable.
 * ════════════════════════════════════════════════════════ */
async function callAIProxy(messages,maxTokens=1000){
  // In claude.ai artifact viewer: use built-in runtime
  if(typeof fetch==='function'&&window.location.hostname.includes('claude.ai')){
    // Fall through to claude.ai runtime (handled by existing proxy)
    return null;
  }
  // On Netlify: use serverless function
  try{
    const resp=await fetch('/.netlify/functions/ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,messages})
    });
    if(!resp.ok)throw new Error('AI proxy error '+resp.status);
    return await resp.json();
  }catch(e){console.warn('AI proxy:',e);return null;}
}

  if(document.getElementById('gsearch'))return;
  const el=document.createElement('div');el.className='srch-overlay';el.id='gsearch';
  el.innerHTML=`<div class="srch-box"><div class="srch-inp-wrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="gsrch-inp" placeholder="Raadi macmiil, invoice, alaab... (Ctrl+K)" autocomplete="off"></div><div class="srch-results" id="gsrch-res"><div class="srch-empty">Wax ku qor...</div></div><div class="srch-hint"><span>↵ Fur</span><span>Esc Xir</span></div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click',e=>{if(e.target===el)closeSearch();});
  setTimeout(()=>document.getElementById('gsrch-inp')?.focus(),50);
  document.getElementById('gsrch-inp').addEventListener('input',doSearch);
  document.getElementById('gsrch-inp').addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if(e.key==='Enter'){document.querySelector('.srch-item')?.click();}});
}
function closeSearch(){document.getElementById('gsearch')?.remove();}
function doSearch(ev){
  const q=(ev.target.value||'').toLowerCase().trim();
  const res=document.getElementById('gsrch-res');if(!res)return;
  if(!q){res.innerHTML='<div class="srch-empty">Wax ku qor...</div>';return;}
  let html='';
  const cust=S.contacts.filter(c=>c.type==='macmiil'&&(c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)));
  if(cust.length)html+=`<div class="srch-grp">Macaamiisha</div>`+cust.slice(0,4).map(c=>`<div class="srch-item" onclick="closeSearch();V='customers';render()"><div class="srch-item-ic" style="background:${COL.customers||'#d6478a'}">${ic('custgrp')}</div><div class="srch-item-body"><div class="srch-item-title">${esc(c.name)}</div><div class="srch-item-sub">${esc(c.phone||'')}</div></div></div>`).join('');
  const supp=S.contacts.filter(c=>c.type==='alaab'&&(c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)));
  if(supp.length)html+=`<div class="srch-grp">Alaab-qeybiyayaasha</div>`+supp.slice(0,3).map(c=>`<div class="srch-item" onclick="closeSearch();V='suppliers';render()"><div class="srch-item-ic" style="background:${COL.suppliers||'#a0623a'}">${ic('pers')}</div><div class="srch-item-body"><div class="srch-item-title">${esc(c.name)}</div><div class="srch-item-sub">${esc(c.phone||'')}</div></div></div>`).join('');
  const prods=S.products.filter(p=>p.name.toLowerCase().includes(q));
  if(prods.length)html+=`<div class="srch-grp">Alaabta</div>`+prods.slice(0,4).map(p=>`<div class="srch-item" onclick="closeSearch();V='prod';render()"><div class="srch-item-ic" style="background:${COL.prod||'#e0a11b'}">${ic('bag')}</div><div class="srch-item-body"><div class="srch-item-title">${esc(p.name)}</div><div class="srch-item-sub">Stock: ${p.stock}</div></div><div class="srch-item-val">${money(p.price)}</div></div>`).join('');
  const docs=S.docs.filter(d=>{const c=contact(d.contactId);return d.no.toLowerCase().includes(q)||(c?.name||d.customerName||'').toLowerCase().includes(q);});
  if(docs.length)html+=`<div class="srch-grp">Invoices</div>`+docs.slice(0,5).map(d=>{const c=contact(d.contactId);const[cl,ct]=status(d);return`<div class="srch-item" onclick="closeSearch();openView('${d.id}')"><div class="srch-item-ic" style="background:${d.type==='sale'?COL.sale:COL.purchase}">${ic(d.type==='sale'?'sale':'purchase')}</div><div class="srch-item-body"><div class="srch-item-title">${d.no}</div><div class="srch-item-sub">${esc(c?.name||d.customerName||'')} · ${fdate(d.date)}</div></div><div style="text-align:right"><div class="srch-item-val">${money(total(d))}</div><span class="b ${cl}" style="font-size:11px">${ct}</span></div></div>`;}).join('');
  if(!html)html='<div class="srch-empty">Wax la mid ah lama helin.</div>';
  res.innerHTML=html;trDom(res);
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch();}});

/* ===== PWA INSTALL ===== */
let _pwaPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_pwaPrompt=e;showInstallBanner();});
window.addEventListener('appinstalled',()=>{hideInstallBanner();toast('✓ App waa la rakibay!');});
function showInstallBanner(){
  if(document.getElementById('pwa-banner'))return;
  const b=document.createElement('div');b.id='pwa-banner';
  b.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex:1">${LOGO}<div><b style="font-size:14px">Shilling</b><div style="font-size:12px;opacity:.8">Phone-kaaga ku rakib</div></div></div><button onclick="installPwa()" style="background:#fff;color:#1a52cc;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap">Rakib</button><button onclick="hideInstallBanner()" style="background:none;border:0;color:#fff;opacity:.7;cursor:pointer;padding:4px 8px;font-size:18px">×</button>`;
  document.body.appendChild(b);
}
function hideInstallBanner(){document.getElementById('pwa-banner')?.remove();}
function installPwa(){
  if(_pwaPrompt){_pwaPrompt.prompt();_pwaPrompt.userChoice.then(r=>{if(r.outcome==='accepted')hideInstallBanner();_pwaPrompt=null;});}
  else{showIosInstructions();}
}

        <div style="padding:8px 0">③ Riix <b>"Add"</b> midig sare</div>

// Register service worker for offline support
if('serviceWorker' in navigator){
  const sw=`const CACHE='shilling-v1';self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['.']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const rc=res.clone();caches.open(CACHE).then(c=>c.put(e.request,rc));return res;}).catch(()=>caches.match('.')))));`;
  try{const blob=new Blob([sw],{type:'text/javascript'});const url=URL.createObjectURL(blob);navigator.serviceWorker.register(url).then(()=>{''/*SW registered*/}).catch(()=>{});}catch(e){}
}
