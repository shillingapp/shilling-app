<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shilling – Nidaamka Xisaabaadka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f1;--surface:#ffffff;--surface2:#f5f8f7;--ink:#15221f;--muted:#5f716c;--line:#dbe3e1;
  --side:#0c1d6e;--side2:#172e99;--side-ink:#c0cfff;--brand:#1a52cc;--accent:#e6a23a;
  --pos:#177a51;--neg:#bd3d35;--posbg:#e0f2e8;--negbg:#fae5e3;--warnbg:#fcefd6;--warn:#8a5a0b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b1514;--surface:#122220;--surface2:#173029;--ink:#e5efec;--muted:#93a9a3;--line:#24403b;--side:#071240;--side2:#12246e;--brand:#4d7af8;--pos:#4cc58c;--neg:#ee7b73;--posbg:#15382b;--negbg:#3d1f1d;--warnbg:#3b2f14;--warn:#f0c26e}
}
:root[data-theme="dark"]{--bg:#0b1514;--surface:#122220;--surface2:#173029;--ink:#e5efec;--muted:#93a9a3;--line:#24403b;--side:#071240;--side2:#12246e;--brand:#4d7af8;--pos:#4cc58c;--neg:#ee7b73;--posbg:#15382b;--negbg:#3d1f1d;--warnbg:#3b2f14;--warn:#f0c26e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:21px;color:#fff;padding:2px 10px 4px}
.bsub{padding:0 10px 18px;font-size:13px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;margin-bottom:2px;border:0;background:none;color:var(--side-ink);border-radius:8px;cursor:pointer;text-align:left}
.ni:hover{background:rgba(255,255,255,.07)}
.ni.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.ni svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:26px clamp(14px,3vw,38px) 48px;width:100%;max-width:1240px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:clamp(24px,3vw,32px);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.brand{color:var(--brand)}
.qa4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 2px 10px;margin-bottom:14px}
.qc4{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:0;color:var(--ink);text-align:center;min-width:0;width:100%}
.qc4 .pt{width:50px;height:50px;border-radius:14px}
.qc4 .pt svg{width:23px;height:23px}
.qc4 b{font-size:11px;font-weight:700;line-height:1.3}
.qc4 small{font-size:10px;color:var(--muted);line-height:1.2}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-hd h3{margin:0;font-size:16px}
.mstat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mcard{border-radius:18px;padding:14px 12px;min-width:0}
.mcard.bl{background:#e8f0fe}
.mcard.am{background:#fef3e8}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mc-lbl{font-size:12px;color:var(--muted)}
.mc-val{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(17px,5vw,22px);font-weight:700;margin-bottom:2px}
.mcard.bl .mc-val{color:#1a52cc}
.mcard.am .mc-val{color:#e5622d}
.mc-bar{margin-top:8px;line-height:0}
.hslide{display:flex;overflow-x:scroll;scroll-snap-type:x mandatory;scroll-behavior:smooth;gap:10px;margin-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:22px}
.hslide::-webkit-scrollbar{display:none}
.hslide .hero2{flex:none;width:100%;scroll-snap-align:start;margin-bottom:0}
.hdots{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.hd{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.25s}
.hd.on{width:20px;border-radius:3px;background:var(--brand)}
.s2top{font-size:14px;opacity:.75;margin-bottom:14px}
.s2row{display:flex;align-items:center;margin-bottom:14px}
.s2item{flex:1}
.s2div{width:1px;height:56px;background:rgba(255,255,255,.2);margin:0 14px}
.s2lbl{font-size:13px;opacity:.75;margin-bottom:4px}
.s2val{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(20px,6.5vw,28px);font-weight:700;color:#fff;margin-bottom:3px}
.s2sub{font-size:12px;opacity:.65}
.s2bot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
.s2bot span{opacity:.8;font-size:14px}
.s2bot b{font-size:17px;font-weight:700}
.s2grn{color:#86efac}.s2red{color:#fca5a5}
.bottom{display:none}
.mtop,.dash-m{display:none}
.pt{display:inline-grid;place-items:center;flex:none;width:44px;height:44px;border-radius:14px;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.pt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hero2{position:relative;background:linear-gradient(135deg,#0c1d6e,#1a3494);color:#fff;border-radius:22px;padding:20px 20px 16px;box-shadow:0 10px 24px rgba(4,65,61,.25);margin-bottom:14px}
.hero2 .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero2 .lbl{display:flex;align-items:center;gap:8px;font-size:17px}
.hero2 .eye{background:none;border:0;color:#fff;padding:2px;cursor:pointer;display:grid}
.hero2 .eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.hero2 .big{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(30px,9.5vw,44px);font-weight:700;margin-top:6px;line-height:1.1}
.hero2 .wal{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.hero2 .wal svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hero2 .pl{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:16px}
.pill{display:inline-block;padding:2px 9px;border-radius:8px;font-size:13px;font-weight:600;background:rgba(74,197,140,.25);color:#8ff0bd}
.pill.dn{background:rgba(238,123,115,.25);color:#ffb7b1}
.hero2 .pv{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(24px,7.5vw,32px);font-weight:700;color:var(--accent);margin-top:2px}
.hero2 .pv.neg{color:#ff9f97}
.hero2 .go{position:absolute;right:14px;bottom:12px;background:none;border:0;color:#fff;font-size:28px;line-height:1;cursor:pointer}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.qa .pt{width:36px;height:36px;border-radius:11px}
.qa .pt svg{width:19px;height:19px}
.qcard{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;color:var(--ink);text-align:left;cursor:pointer;min-width:0}
.qcard span:last-child{min-width:0}
.qcard b{display:block;font-size:13.5px;white-space:nowrap;letter-spacing:-.01em}
.qcard small{color:var(--muted);font-size:12px;line-height:1.25;display:block}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec h2{font-size:22px}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:4px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tcard{border-radius:16px;padding:12px 10px;border:1px solid color-mix(in srgb,var(--pc) 18%,var(--line));background:color-mix(in srgb,var(--pc) 7%,var(--surface));min-width:0}
.tcard .pt{width:34px;height:34px;border-radius:10px;margin-bottom:8px}
.tcard .pt svg{width:18px;height:18px}
.tcard .tl{font-size:13.5px}
.tcard .tv{font-size:clamp(15px,4.6vw,20px);font-weight:700;color:var(--pc);margin:2px 0;white-space:nowrap}
.tcard small{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:18px;margin-bottom:8px}
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer;text-align:left;color:var(--ink)}
.srow:last-child{border-bottom:0}
.pt.sm{width:34px;height:34px;border-radius:10px}
.pt.sm svg{width:18px;height:18px}
.srow .l{flex:1;font-size:15px;min-width:0}
.srow .l i{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:6px}
.srow b{font-size:17px;white-space:nowrap}
.srow em,.al em,.mrow em{color:var(--muted);font-style:normal;font-size:22px;line-height:1}
.duo{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-bottom:14px}
.duo .card{margin:0;padding:12px;min-width:0}
.duo h3{font-size:15px;line-height:1.25}
.lg-row{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:2px}
.lg-row i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.al{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-radius:12px;padding:10px 8px;margin-bottom:8px;cursor:pointer;background:color-mix(in srgb,var(--pc) 12%,var(--surface));color:var(--ink)}
.al svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--pc);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.al span{flex:1;min-width:0}
.duo .al em{display:none}
.al b{display:block;font-size:13px;line-height:1.2}
.al small{color:var(--muted);font-size:12px}
.mrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 4px;background:none;border:0;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer;color:var(--ink);text-align:left}
.mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding:10px 14px 6px}
.mt-in{display:flex;align-items:center;gap:8px}
.mt-brand{display:flex;align-items:center;gap:6px;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;color:var(--brand);letter-spacing:.01em}
.mt-biz{flex:1;min-width:0;background:none;border:0;text-align:left;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--ink)}
.mt-bell{position:relative;background:none;border:0;padding:6px;cursor:pointer;color:var(--ink);display:grid}
.mt-bell svg,.mt-av svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mt-bell i{position:absolute;top:0;right:0;background:#d64545;color:#fff;border-radius:99px;font-size:11px;font-style:normal;font-weight:600;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.mt-av{width:42px;height:42px;border-radius:50%;background:#0d3836;color:#fff;border:0;display:grid;place-items:center;cursor:pointer}
.mt-av svg{width:22px;height:22px}
.inv-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.inv-biz{display:flex;align-items:center;gap:10px;font-size:19px;font-family:'Bricolage Grotesque',sans-serif;margin-bottom:4px}
.inv-title{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--brand)}
.inv-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px}
.inv-meta .k{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.inv-foot{text-align:center;margin-top:18px}
.pdet{border-top:1px solid var(--line);margin-top:12px}
.sg{font-size:10px;font-weight:700;letter-spacing:.08em;padding:14px 12px 3px;color:rgba(255,255,255,.38);text-transform:uppercase}
.mmenu{display:flex;flex-direction:column;gap:2px;margin:-4px 0}
.mmi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 4px;border:0;background:none;color:var(--ink);cursor:pointer;border-radius:10px;text-align:left;font-size:15px}
.mmi:hover{background:var(--surface2)}
.mmi span{flex:1}


#sync-status{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+62px);right:14px;font-size:11px;padding:4px 10px;border-radius:99px;display:flex;align-items:center;gap:5px;z-index:50;opacity:0;transition:opacity .4s;pointer-events:none}
#sync-status.show{opacity:1}
#sync-status.ok{background:#dcfce7;color:#166534}
#sync-status.syncing{background:#dbeafe;color:#1e40af}
#sync-status.err{background:#fee2e2;color:#991b1b}
@media(min-width:861px){#sync-status{bottom:14px;right:28px}}

#pwa-banner{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);left:12px;right:12px;background:linear-gradient(135deg,#1a52cc,#0d1b4e);color:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:100;box-shadow:0 4px 24px rgba(0,0,0,.3)}
@media (min-width:861px){#pwa-banner{bottom:16px;left:auto;right:24px;width:320px}}


.srch-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.srch-box{background:var(--surface);border-radius:16px;width:100%;max-width:600px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.srch-inp-wrap{display:flex;align-items:center;padding:14px 16px;gap:10px;border-bottom:1px solid var(--line)}
.srch-inp-wrap svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}
.srch-inp-wrap input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
.srch-results{max-height:55vh;overflow-y:auto}
.srch-grp{padding:8px 16px 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.srch-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.srch-item:hover{background:var(--surface2)}
.srch-item-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.srch-item-ic svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.srch-item-body{flex:1;min-width:0}
.srch-item-title{font-size:14px;font-weight:600}
.srch-item-sub{font-size:12px;color:var(--muted)}
.srch-item-val{font-size:14px;font-weight:600;white-space:nowrap}
.srch-empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
.srch-hint{padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:14px}

.mmi em{color:var(--muted);font-style:normal;font-size:22px;line-height:1}

#dsk-head{display:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 28px;align-items:center;gap:14px;position:sticky;top:0;z-index:30;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.dsk-srch{flex:0 1 400px;position:relative}
.dsk-srch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;font-size:13px}
.dsk-si{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.dsk-rt{display:flex;align-items:center;gap:8px;margin-left:auto}
.dsk-dt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:8px;background:none;cursor:pointer;white-space:nowrap}
.dsk-dt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.dsk-bl{position:relative;background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;display:grid;place-items:center}
.dsk-bl svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.dsk-nb{position:absolute;top:-7px;right:-7px;background:#ef476f;color:#fff;border-radius:99px;min-width:17px;height:17px;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);padding:0 3px}
.dsk-usr{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 12px 5px 6px;background:none;cursor:pointer;color:var(--ink)}
.dsk-av{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.dsk-unm{font-size:13px;font-weight:600;text-align:left;line-height:1.3}
.dsk-url{font-size:11px;color:var(--muted);text-align:left;line-height:1.2}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:flex;gap:12px;align-items:flex-start}
.kpi-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi-bd{flex:1;min-width:0}
.kpi-lbl{font-size:12px;color:var(--muted);margin-bottom:3px}
.kpi-v{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(18px,1.5vw,23px);font-weight:700;line-height:1.1;margin-bottom:2px}
.kpi-pct{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:6px;font-size:11px;font-weight:600}
.kpi-pct.up{background:var(--posbg);color:var(--pos)}.kpi-pct.dn{background:var(--negbg);color:var(--neg)}
.kpi-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.dsh-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.dsh-title{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:700;margin:0 0 3px;line-height:1.1}
.dsh-sub{color:var(--muted);font-size:13px;margin:0}
.dsh-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side-biz{display:flex;align-items:center;gap:9px;padding:6px 12px 8px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:4px}
.side-biz-av{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none}
.side-biz-av svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round}
.side-biz-nm{font-size:13px;font-weight:700;color:#fff;line-height:1.3}
.side-biz-st{font-size:11px;display:flex;align-items:center;gap:4px;color:rgba(255,255,255,.55)}
.sdot{width:6px;height:6px;border-radius:50%;background:#4ade80;display:inline-block;flex:none}

/* ════ AUTH UI HELPERS ════════════════════════════════*/

}

  document.getElementById('fb-auth').style.display='none';

}
function fbShowRegister(){
  document.getElementById('fb-login-form').style.display='none';

function fbSetLoading(on){
  const inReg=document.getElementById('fb-auth-title').textContent.includes('cusub');
  document.getElementById('fb-login-form').style.display=on||inReg?'none':'block';
  document.getElementById('fb-register-form').style.display=on||!inReg?'none':'block';

}
function fbShowError(msg){ const el=document.getElementById('fb-auth-error');if(el){el.textContent=msg;el.style.display='block';} }
function fbShowSuccess(msg){ const el=document.getElementById('fb-auth-success');if(el){el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',3000);} }
function fbClearMsg(){
  const e=document.getElementById('fb-auth-error'),s=document.getElementById('fb-auth-success');
  if(e)e.style.display='none'; if(s)s.style.display='none';
}

/* ════ AUTH ACTIONS ═══════════════════════════════════*/
async function fbSignIn(){
  if(!FIREBASE_ENABLED){fbHideAuth();fbLaunchApp();return;}
  const email=document.getElementById('fb-email').value.trim();
  const pw=document.getElementById('fb-password').value;
  if(!email||!pw){fbShowError('Email iyo erayga sirta ah ku qor.');return;}
  fbClearMsg();fbSetLoading(true);
  try{
    await _fbAuth.signInWithEmailAndPassword(email,pw);
    // onAuthStateChanged handles the rest
  }catch(e){
    fbSetLoading(false);
    document.getElementById('fb-login-form').style.display='block';
    fbShowError(fbErr(e.code));
  }
}
async function fbRegister(){
  if(!FIREBASE_ENABLED){fbHideAuth();fbLaunchApp();return;}
  const email=document.getElementById('fb-reg-email').value.trim();
  const pw=document.getElementById('fb-reg-password').value;
  if(!email||!pw){fbShowError('Email iyo erayga sirta ah ku qor.');return;}
  if(pw.length<6){fbShowError(FB_ERRORS['auth/weak-password']);return;}
  fbClearMsg();fbSetLoading(true);
  try{
    const cred=await _fbAuth.createUserWithEmailAndPassword(email,pw);
    // Create user document
    await _fbDb.collection('users').doc(cred.user.uid).set({
      uid:cred.user.uid,email:cred.user.email,displayName:'',
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    // onAuthStateChanged will fire and check for business
  }catch(e){
    fbSetLoading(false);
    document.getElementById('fb-register-form').style.display='block';
    fbShowError(fbErr(e.code));
  }
}
async function fbSignOut(){
  if(!FIREBASE_ENABLED)return;
  try{await _fbAuth.signOut();}catch(e){toast('Sign out khalad: '+e.message);}
}

/* ════ BUSINESS CREATION ══════════════════════════════*/
function fbShowBizSetup(){
  document.getElementById('fb-biz-setup').style.display='block';
}
function fbHideBizSetup(){
  document.getElementById('fb-biz-setup').style.display='none';

async function fbCreateBusiness(){
  const name=document.getElementById('fb-biz-name').value.trim();
  const phone=document.getElementById('fb-biz-phone').value.trim();
  if(!name){
    const el=document.getElementById('fb-biz-error');
    if(el){el.textContent='Magaca ganacsiga ku qor.';el.style.display='block';}
    return;
  }
  if(!_fbUser){return;}
  try{
    const bizRef=_fbDb.collection('businesses').doc();
    const bizId=bizRef.id;
    const batch=_fbDb.batch();
    batch.set(bizRef,{
      name,phone,address:'',cur:'$',evc:'',edahab:'',salaam:'',
      openingCash:0,ownerUid:_fbUser.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.set(_fbDb.collection('businesses').doc(bizId).collection('members').doc(_fbUser.uid),{
      uid:_fbUser.uid,role:'owner',status:'active',
      joinedAt:firebase.firestore.FieldValue.serverTimestamp(),invitedBy:null
    });
    await batch.commit();
    _fbBizId=bizId;_fbBizData={name,phone};_fbRole='owner';
    // Also populate local settings from new business name
    S.settings.name=name;if(phone)S.settings.phone=phone;save();
    fbHideBizSetup();fbLaunchApp();
    showSyncStatus('✓ Ganacsiga la abuuray','ok',3000);
  }catch(e){
    const el=document.getElementById('fb-biz-error');
    if(el){el.textContent='Khalad: '+e.message;el.style.display='block';}
  }
}

/* ════ AUTH STATE & APP LAUNCH ════════════════════════*/
async function fbLoadBusiness(uid){
  try{
    // Find user's business memberships
    const membersSnap=await _fbDb.collectionGroup('members')
      .where('uid','==',uid).where('status','==','active').limit(1).get();
    if(membersSnap.empty){
      // New user — show business setup
      fbHideAuth();fbShowBizSetup();
      return false;
    }
    const memberDoc=membersSnap.docs[0];
    _fbRole=memberDoc.data().role;
    // Extract bizId from path: businesses/{bizId}/members/{uid}
    const pathParts=memberDoc.ref.path.split('/');
    _fbBizId=pathParts[1];
    const bizSnap=await _fbDb.collection('businesses').doc(_fbBizId).get();
    if(bizSnap.exists)_fbBizData=bizSnap.data();
    return true;
  }catch(e){
    console.warn('loadBusiness error:',e);return false;
  }
}

function fbLaunchApp(){window._fbUser=_fbUser;

  fbHideAuth();fbHideBizSetup();
  if(_fbUser)window._fbActorUid=_fbUser.uid;
  syncServerTime().catch(()=>{});
  const app=document.querySelector('.app');if(app)app.style.display='';
  // Check if previously in Firestore primary mode
  let shouldRestorePrimary=false;
  try{const cs=JSON.parse(localStorage.getItem('xisaab_cutover')||'{}');
    shouldRestorePrimary=cs.status==='primary'&&cs.bizId===_fbBizId;}catch(e){}
  if(_fbBizId&&FIREBASE_ENABLED){
    if(shouldRestorePrimary){
      // Re-hydrate and restore listeners
      fbHydrateFromFirestore().then(ok=>{
        if(ok){_dataSource=DS.FIRESTORE;_cutoverStatus=CUTOVER_STATUS.FIRESTORE_PRIMARY;
          fbSetupListeners();showSyncStatus('🔥 Firestore PRIMARY','ok',2000);}
        else{fbInitFirestoreSync();showSyncStatus('✓ '+(_fbBizData?.name||'Firebase'),'ok',2000);}
        render();
      });
    }else{
      fbInitFirestoreSync();
      showSyncStatus('✓ '+(_fbBizData?.name||'Firebase'),'ok',2000);
    }
  }
  render();
}

/* ════ FIRESTORE SYNC (replaces claude.ai runtime sync) ═*/
let _fbSyncDoc=null,_fbSyncTimer=null,_fbLastSave=0;
function fbInitFirestoreSync(){
  if(!_fbDb||!_fbBizId||!_fbUser)return;
  // Store accounting data at: businesses/{bizId}/localState/{uid}
  _fbSyncDoc=_fbDb.collection('businesses').doc(_fbBizId)
                   .collection('localState').doc(_fbUser.uid);
  // Load from Firestore if newer
  _fbSyncDoc.get().then(snap=>{
    if(!snap.exists)return;
    const d=snap.data();
    const remoteT=+(d.updatedAt?.toMillis?.()||d.updatedAt||0);
    const localT=+(S._updatedAt||0);
    if(remoteT>localT&&d.payload){
      try{
        S=Object.assign(blank(),JSON.parse(d.payload));
        S._updatedAt=remoteT;
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
        render();showSyncStatus('↓ Xogta Firebase la helay','ok',3000);
      }catch(e){console.warn('Firestore parse:',e);}
    }
  }).catch(e=>console.warn('Firestore load:',e));
  // Real-time listener
  _fbSyncDoc.onSnapshot(snap=>{
    if(!snap||!snap.exists)return;
    const d=snap.data();
    const remoteT=+(d.updatedAt?.toMillis?.()||d.updatedAt||0);
    if(Date.now()-_fbLastSave<5000&&remoteT<=_fbLastSave)return;
    if(remoteT<=(+(S._updatedAt||0)))return;
    if(!d.payload)return;
    try{
      S=Object.assign(blank(),JSON.parse(d.payload));
      S._updatedAt=remoteT;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      render();showSyncStatus('↻ Xog cusboonaysiiyay','syncing',2500);
    }catch(e){console.warn('Snapshot parse:',e);}
  },err=>console.warn('Snapshot error:',err));
}

/* ════ FIREBASE SAVE OVERRIDE ════════════════════════*/
const _origSave2=save;
save=function(){
  _origSave2();
  if(!_fbSyncDoc)return;
  clearTimeout(_fbSyncTimer);
  showSyncStatus('↑ Keydaynaya...','syncing',0);
  _fbSyncTimer=setTimeout(()=>{
    const ts=Date.now();_fbLastSave=ts;S._updatedAt=ts;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    const payload=JSON.stringify(S);
    if(payload.length>200000){showSyncStatus('⚠ Xogta aad bay u weyntahay','err',4000);return;}
    _fbSyncDoc.set({payload,updatedAt:firebase.firestore.Timestamp.fromMillis(ts)})
      .then(()=>showSyncStatus('✓ Firebase keydiyay','ok'))
      .catch(e=>console.warn('Firestore save:',e));
  },1000);
};

/* ════ INIT FIREBASE ══════════════════════════════════*/
async function initFirebase(){
  if(!FIREBASE_ENABLED){
    // No Firebase config — run in offline/local mode
    console.warn('Firebase not configured — running in localStorage-only mode');
    // Still need to decide: gate app behind auth or show directly?
    // For safety in local dev: show app directly
    fbLaunchApp();
    return;
  }
  try{
    _fbApp=firebase.initializeApp(FIREBASE_CONFIG);
    _fbAuth=firebase.auth();
    _fbDb=firebase.firestore();
    // Listen for auth state changes
    _fbAuth.onAuthStateChanged(async user=>{
      _fbUser=user;
      if(!user){
        // Not authenticated — show login screen
        fbShowAuth();
        // Hide app behind auth
        const app=document.querySelector('.app');
        if(app)app.style.display='none';
        const header=document.querySelector('.mtop');
        if(header)header.style.display='none';
        const nav=document.querySelector('.bottom');
        if(nav)nav.style.display='none';
        const side=document.querySelector('.side');
        if(side)side.style.display='none';
      }else{
        // Authenticated — find/create business
        fbHideAuth();
        // Show app elements
        const app=document.querySelector('.app');if(app)app.style.display='';
        const header=document.querySelector('.mtop');if(header)header.style.display='';
        const nav=document.querySelector('.bottom');if(nav)nav.style.display='';
        const side=document.querySelector('.side');if(side)side.style.display='';
        const loaded=await fbLoadBusiness(user.uid);
        if(loaded)fbLaunchApp();
      }
    });
  }catch(e){
    console.warn('Firebase init failed:',e);
    // Graceful degradation — run app without Firebase
    fbLaunchApp();
  }
}

function trStr(s){
  if(LANG!=='en'||!s)return s;
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return s;
  let r=EN[core];
  if(r===undefined)for(const [re,to] of RX){if(re.test(core)){r=core.replace(re,to);break}}
  return r===undefined?s:m[1]+r+m[3];
}
function trDom(root){
  if(LANG!=='en'||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))continue;const v=trStr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
  root.querySelectorAll('[placeholder],[aria-label]').forEach(el=>['placeholder','aria-label'].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,trStr(el.getAttribute(a)))}));
}

function auditLog(action,type,entityId,no,desc,snap,before,after,relatedId){
  if(!S.audit)S.audit=[];
  const auditEntry={
    id:'au'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    ts:new Date().toISOString(),
    actor:window._fbActorUid||'System',
    action,type,
    entityId:entityId||'',no:no||'',desc:desc||'',relatedId:relatedId||'',
    snap:snap||null,before:before||null,after:after||null
  };
  S.audit.push(auditEntry);
  if(S.audit.length>2000)S.audit=S.audit.slice(-2000);
  // Trusted server-side audit via Cloud Function (Firestore primary mode)
  if(FIREBASE_ENABLED&&_fbBizId&&_dataSource===DS.FIRESTORE&&window._fbActorUid){
    try{
      const fn=firebase.functions().httpsCallable('createAuditEvent');
      fn({bizId:_fbBizId,action,entityType:type,entityId:entityId||'',
         no:no||'',desc:desc||'',relatedId:relatedId||'',
         snap:snap||null,before:before||null,after:after||null
      }).catch(e=>console.warn('Audit CF:',e));
    }catch(e){}
  }
}
function auditSnap(obj){
  try{const o={...obj};if(o.lines&&o.lines.length>20)o.lines=[...o.lines.slice(0,20),{_more:o.lines.length-20}];if(o.payments&&o.payments.length>20)o.payments=o.payments.slice(0,20);return JSON.parse(JSON.stringify(o));}catch(e){return{_err:'snap failed'};}
}

// MIGRATION: Convert old negative-payment refunds to new model (runs once on load)
(function migrateRefunds(){
  S.returns.forEach(r=>{
    if(r.refundAccountId!==undefined)return; // already migrated
    const d=S.docs.find(x=>x.id===r.docId);
    if(!d)return;
    const refundPmt=d.payments.find(p=>p.ret===r.id&&p.amount<0);
    if(refundPmt){
      r.refundAccountId=refundPmt.accountId||'';
      r.refund=Math.abs(refundPmt.amount);
      // Remove the negative payment
      d.payments=d.payments.filter(p=>p.id!==refundPmt.id);
    } else {
      r.refundAccountId=''; // mark as migrated, no refund
    }
  });
})();

async function syncServerTime(){
  try{
    if(_fbDb){
      const t0=Date.now();
      const ref=await _fbDb.collection('_serverTime').doc('ping')
        .set({t:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      // Use Firestore timestamp from a read
      const snap=await _fbDb.collection('_serverTime').doc('ping').get();
      if(snap.exists&&snap.data().t){
        const serverMs=snap.data().t.toMillis();
        const localMs=Date.now();
        _serverTimeOffset=serverMs-localMs;
      }
    }
  }catch(e){_serverTimeOffset=0;}
}

function stats(m){
  let inn=0,out=0,gross=0,cogs=0,exp=0,ret=0,adj=0;
  S.docs.forEach(d=>{
    if(d.type==='sale'){
      if(ym(d.date)===m){gross+=total(d);cogs+=sum(d.lines,l=>l.qty*(l.cost||0))}
      d.payments.forEach(p=>{if(ym(p.date)===m){if(p.amount>=0)inn+=p.amount;else out-=p.amount}});
    }else d.payments.forEach(p=>{if(ym(p.date)===m)out+=p.amount});
  });
  S.returns.forEach(r=>{if(ym(r.date)===m){ret+=r.credit;if(r.restock)cogs-=sum(r.lines,l=>l.qty*(l.cost||0))}});
  S.adjustments.forEach(a=>{if(ym(a.date)===m)adj+=a.delta*(a.cost||0)});
  S.expenses.forEach(x=>{if(ym(x.date)===m){exp+=x.amount;out+=x.amount}});
  const sales=gross-ret;
  // Purchase return amounts reduce out-flow (money back from supplier)
  (S.purchaseReturns||[]).forEach(r=>{if(ym(r.date)===m)out=Math.max(0,out-r.amount);});
  return{inn,out,gross,ret,adj,sales,cogs,exp,profit:sales-cogs-exp+adj};
}

function bankBalance(bankId){
  const bank=(S.banks||[]).find(x=>x.id===bankId);
  if(!bank)return 0;
  const opening=+(bank.openingBal??bank.balance??0);
  let bal=opening;
  S.docs.forEach(d=>d.payments.forEach(p=>{
    if(!p.accountId||p.accountId!==bankId)return;
    bal+=d.type==='sale'?+p.amount:-+p.amount;
  }));
  (S.expenses||[]).forEach(x=>{if(x.accountId===bankId)bal-=+x.amount;});
  (S.returns||[]).forEach(r=>{if(r.refund>0&&r.refundAccountId===bankId)bal-=+r.refund;});
  (S.purchaseReturns||[]).forEach(r=>{if(r.refundAccountId===bankId)bal+=+r.amount;});
  return bal;
}
function totalBankBal(){const banks=(S.banks||[]).filter(b=>b.active!==false);if(!banks.length)return cashBalance();return sum(banks,b=>{const hasLinks=S.docs.some(d=>d.payments.some(p=>p.accountId===b.id))||(S.expenses||[]).some(x=>x.accountId===b.id);return hasLinks?bankBalance(b.id):+(b.balance||0);});}

function statsRange(from,to){
  // from/to are YYYY-MM-DD strings
  let inn=0,out=0,gross=0,cogs=0,exp=0,ret=0,adj=0;
  const inR=d=>d>=from&&d<=to;
  S.docs.forEach(d=>{
    if(d.type==='sale'){
      if(inR(d.date)){gross+=total(d);cogs+=sum(d.lines,l=>l.qty*(l.cost||0))}
      d.payments.forEach(p=>{if(inR(p.date)){if(p.amount>=0)inn+=p.amount;else out-=p.amount}});
    }else d.payments.forEach(p=>{if(inR(p.date))out+=p.amount});
  });
  S.returns.forEach(r=>{if(inR(r.date)){ret+=r.credit;if(r.restock)cogs-=sum(r.lines,l=>l.qty*(l.cost||0))}});
  S.adjustments.forEach(a=>{if(inR(a.date))adj+=a.delta*(a.cost||0)});
  S.expenses.forEach(x=>{if(inR(x.date)){exp+=x.amount;out+=x.amount}});
  const sales=gross-ret;
  // Purchase return amounts reduce out-flow (money back from supplier)
  (S.purchaseReturns||[]).forEach(r=>{if(inR(r.date))out=Math.max(0,out-r.amount);});
  return{inn,out,gross,ret,adj,sales,cogs,exp,profit:sales-cogs-exp+adj};
}
function dateRange(period){
  const t=today(),d=new Date(t);
  switch(period){
    case 'today':return{from:t,to:t};
    case 'week':{const w=new Date(d);w.setDate(d.getDate()-6);return{from:fmtD(w),to:t};}
    case 'month':return{from:t.slice(0,7)+'-01',to:t};
    case 'lastmonth':{const lm=new Date(d.getFullYear(),d.getMonth()-1,1);const lme=new Date(d.getFullYear(),d.getMonth(),0);return{from:fmtD(lm),to:fmtD(lme)};}
    case 'year':return{from:t.slice(0,4)+'-01-01',to:t};
    case 'custom':return{from:F.repFrom||t.slice(0,7)+'-01',to:F.repTo||t};
    default:return{from:t.slice(0,7)+'-01',to:t};
  }
}

function cashBalance(){let c=+(S.settings.openingCash||0);S.docs.forEach(d=>d.payments.forEach(p=>{if(p.accountId)return;c+=d.type==='sale'?p.amount:-p.amount}));S.expenses.forEach(x=>{if(!x.accountId)c-=x.amount});(S.returns||[]).forEach(r=>{if(r.refund>0&&!r.refundAccountId)c-=+r.refund});return c}

/* ---- Statement date-range helpers ---- */
function stmtBalBefore(id, fromDate, isCustomer){
  const docType = isCustomer ? 'sale' : 'purchase';
  const c = S.contacts.find(x=>x.id===id);
  const opening = +(c?.openingBal||0);
  // All docs strictly BEFORE fromDate
  const prevDocs = S.docs.filter(d=>d.contactId===id && d.type===docType && d.date<fromDate);
  if(isCustomer){
    return opening + sum(prevDocs, d=>Math.max(0,due(d)));
  } else {
    return opening + sum(prevDocs, d=>Math.max(0,due(d)-purchaseRetCredit(d.id)));
  }
}
function stmtMovements(id, fromDate, toDate, isCustomer){
  const docType = isCustomer ? 'sale' : 'purchase';
  // Docs within period
  const docs = S.docs.filter(d=>d.contactId===id && d.type===docType && d.date>=fromDate && d.date<=toDate)
                     .sort((a,b)=>a.date.localeCompare(b.date));
  // Build flat transaction list with type tags
  const txns = [];
  docs.forEach(d=>{
    txns.push({date:d.date,ref:d.no,type:isCustomer?'Iib':'Iibsasho',amount:total(d),dir:1,docId:d.id});
    d.payments.forEach(p=>{
      if(p.date>=fromDate && p.date<=toDate)
        txns.push({date:p.date,ref:d.no,type:'Lacag bixin',amount:p.amount,dir:-1,docId:d.id});
    });
  });
  // Sales returns within period (customer)
  if(isCustomer) S.returns.filter(r=>{
    const d=S.docs.find(x=>x.id===r.docId);
    return d&&d.contactId===id&&r.date>=fromDate&&r.date<=toDate;
  }).forEach(r=>txns.push({date:r.date,ref:r.no,type:'Celin iib',amount:r.credit,dir:-1,docId:r.docId}));
  // Purchase returns within period (supplier)
  if(!isCustomer)(S.purchaseReturns||[]).filter(r=>{
    const d=S.docs.find(x=>x.id===r.docId);
    return d&&d.contactId===id&&r.date>=fromDate&&r.date<=toDate;
  }).forEach(r=>txns.push({date:r.date,ref:r.no||'',type:'Celin iibsasho',amount:r.amount,dir:-1,docId:r.docId}));
  return txns.sort((a,b)=>a.date.localeCompare(b.date)||a.type.localeCompare(b.type));
}

  data.forEach((d,i)=>{
    const x=L+i*gw+gw*.18,hi=ph*d.inn/mx,ho=ph*d.out/mx;
    g+=`<rect class="bi" x="${x}" y="${T+ph-hi}" width="${bw}" height="${hi}" rx="3"><title>${monthLabel(ms[i])}: soo gashay ${money(d.inn)}</title></rect>`;

    g+=`<text x="${x+bw}" y="${H-8}" text-anchor="middle">${MONS[LANG][+ms[i].slice(5)-1]}</text>`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lacagta soo gashay iyo baxday lix bilood">${g}</svg>`;
}

function mDash(){

function openBankStmt(bankId){
  const b=(S.banks||[]).find(x=>x.id===bankId);if(!b)return;
  function bankBalBefore(bId, fromDate){
    const opening2=+(b.openingBal??b.balance??0);
    let bal2=opening2;
    S.docs.forEach(d=>d.payments.forEach(p=>{
      if(!p.accountId||p.accountId!==bId)return;
      if(p.date>=fromDate)return;
      bal2+=d.type==='sale'?+p.amount:-+p.amount;
    }));
    (S.expenses||[]).forEach(x=>{if(x.accountId===bId&&x.date<fromDate)bal2-=+x.amount;});
    (S.returns||[]).forEach(r=>{if(r.refund>0&&r.refundAccountId===bId&&r.date<fromDate)bal2-=+r.refund;});
    (S.purchaseReturns||[]).forEach(r=>{if(r.refundAccountId===bId&&r.date<fromDate)bal2+=+r.amount;});
    return bal2;
  }
  function renderBankStmt(period,customFrom,customTo){
    let from,to;
    if(period==='all'){from='2000-01-01';to='2099-12-31';}
    else{const r=dateRange(period==='custom'?'custom':period,customFrom,customTo);from=r.from;to=r.to;}
    const opening=period==='all'?+(b.openingBal??b.balance??0):bankBalBefore(bankId,from);
    let txns=[];
    S.docs.forEach(d=>d.payments.forEach(p=>{
      if(!p.accountId||p.accountId!==bankId)return;
      if(p.date<from||p.date>to)return;
      const c=contact(d.contactId);
      txns.push({date:p.date,desc:(d.type==='sale'?'Lacag macmiil: ':'Lacag alaab: ')+(c?.name||d.customerName||d.no),ref:d.no,in:d.type==='sale'?+p.amount:0,out:d.type==='purchase'?+p.amount:0});
    }));
    (S.expenses||[]).forEach(x=>{if(x.accountId===bankId&&x.date>=from&&x.date<=to)txns.push({date:x.date,desc:'Kharash: '+trStr(x.cat||x.note||''),ref:'',in:0,out:+x.amount});});
    (S.returns||[]).forEach(r=>{if(r.refund>0&&r.refundAccountId===bankId&&r.date>=from&&r.date<=to)txns.push({date:r.date,desc:'Celin macmiil: '+r.no,ref:r.no,in:0,out:+r.refund});});
    (S.purchaseReturns||[]).forEach(r=>{if(r.refundAccountId===bankId&&r.date>=from&&r.date<=to)txns.push({date:r.date,desc:'Celin iibsasho: '+(r.no||''),ref:r.no||'',in:+r.amount,out:0});});
    txns.sort((a,b2)=>a.date.localeCompare(b2.date));
    let run=opening;
    const rows=txns.map(t=>{run+=t.in-t.out;return`<tr><td>${fdate(t.date)}</td><td>${esc(t.desc)}</td><td class="n pos">${t.in?money(t.in):'—'}</td><td class="n neg">${t.out?money(t.out):'—'}</td><td class="n">${money(run)}</td></tr>`;}).join('');
    const totalIn=sum(txns,t=>t.in),totalOut=sum(txns,t=>t.out);
    const periods=['all','month','lastmonth','year','custom'];
    const pLabels={all:'Dhammaan',month:'Bishaan',lastmonth:'Bishii hore',year:'Sanadka',custom:'Dooro'};
    const tabs=periods.map(p=>`<button class="chip ${period===p?'on':''}" onclick="bsRender('${p}')">${pLabels[p]}</button>`).join('');
    const customInputs=period==='custom'?`<div style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="date" id="bsFrom" value="${customFrom||from}" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--surface);color:var(--ink)"> → <input type="date" id="bsTo" value="${customTo||to}" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--surface);color:var(--ink)"> <button class="chip on" onclick="bsRender('custom')">✓</button></div>`:'';
    document.getElementById('bsBody').innerHTML=`
      <div style="margin-bottom:8px">${tabs}${customInputs}</div>
      <div class="inv-meta" style="margin-bottom:10px">
        <div><span class="k">Bilowga</span><b>${money(opening)}</b></div>
        <div><span class="k">Wax soo galay</span><b class="pos">${money(totalIn)}</b></div>
        <div><span class="k">Wax baxay</span><b class="neg">${money(totalOut)}</b></div>
        <div><span class="k">Hadda</span><b>${money(run)}</b></div>
      </div>
      ${txns.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Taariikh</th><th>Sharaxaad</th><th class="n">Wax soo galay</th><th class="n">Wax baxay</th><th class="n">Hadhay</th></tr></thead><tbody>
        <tr style="background:var(--surface2)"><td colspan="4" style="font-size:11px;color:var(--muted)">Bilowga (${period==='all'?'Furista':fdate(from)})</td><td class="n">${money(opening)}</td></tr>
        ${rows}
      </tbody></table></div>`:'<div class="empty">Xog ma jirto muddadan.</div>'}`;
  }
  function bsRender(p){const cf=document.getElementById('bsFrom')?.value||'';const ct=document.getElementById('bsTo')?.value||'';renderBankStmt(p,cf,ct);}
  modal(b.name+' — Xisaabta',`<div id="bsBody"></div>`,true);
  setTimeout(()=>{window.bsRender=bsRender;renderBankStmt('all','','');},20);
}

  const typeOpts=types.map(tp=>`<option value="${tp}" ${typeF===tp?'selected':''}>${tp||'Dhammaan noocyada'}</option>`).join('');
  return head('Diiwaanka Audit','')+

      <select onchange="F.auditAct=this.value;render()" style="padding:6px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--surface);color:var(--ink)">${actOpts}</select>
      <select onchange="F.auditType=this.value;render()" style="padding:6px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--surface);color:var(--ink)">${typeOpts}</select>
    </div>
    <div class="ledger sm" style="margin-bottom:10px">
      <div><span class="k">Dhamaan</span><b>${filtered.length}</b></div>
      <div><span class="k ok">Cusub</span><b>${totals.creates}</b></div>
      <div><span class="k" style="color:#1565c0">Cusboonaysiis</span><b>${totals.updates}</b></div>

      <div><span class="k" style="color:#6a1b9a">Lacag</span><b>${totals.payments}</b></div>
    </div>
  </section>
  <section class="panel" style="margin-top:0">${filtered.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Waqtiga</th><th>Ficil</th><th>Nooca</th><th>Sharaxaad</th><th></th></tr></thead><tbody>
  ${filtered.map(e=>`<tr><td style="font-size:11px;color:var(--muted)">${e.ts.slice(0,16).replace('T',' ')}</td><td>${badge(e.action)}</td><td style="font-size:11px;color:var(--muted)">${e.type}</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px">${esc(e.desc)}</td><td><button class="btn ghost sm" data-act="viewaudit" data-id="${e.id}">Faah</button></td></tr>`).join('')}

}

function recalc(){
  const f=$('#fdoc');if(!f)return;let t=0;
  $$('.lr',f).forEach(r=>{const v=(+$('.lq',r).value||0)*(+$('.lpr',r).value||0);t+=v;$('.lt',r).textContent=money(v)});
  $('#gt').textContent=money(t);
  if(f.dataset.cash){const rv=+f.elements.recv.value||0;$('#chg').value=money(rv>t?rv-t:0)}
  if(!f.dataset.touched)f.elements.paid.value=Math.round(t*100)/100;
}

function openStmt(id, initPeriod){
  const c=contact(id);if(!c)return;
  const isCust=c.type!=='alaab';
  const ctype=isCust?'sale':'purchase';
  const per=initPeriod||'all';
  const t=today();

  function periodDates(p,customFrom,customTo){
    if(p==='all')return{from:'2000-01-01',to:'2099-12-31'};
    return dateRange(p==='custom'?'custom':p,customFrom,customTo);
  }
  // Custom date fields stored on the modal after render
  function renderStmt(period,customFrom,customTo){
    const {from,to}=periodDates(period,customFrom,customTo);
    const openBal=stmtBalBefore(id,from,isCust);
    const txns=stmtMovements(id,from,to,isCust);
    let run=openBal;
    const rows=txns.map(tx=>{
      run+=tx.dir*tx.amount;
      const isDebit=tx.dir>0;
      return`<tr data-act="viewdoc" data-id="${tx.docId||''}">
        <td>${fdate(tx.date)}</td>
        <td>${tx.ref}</td>
        <td><span class="b ${isDebit?'due':'ok'}">${tx.type}</span></td>
        <td class="n ${isDebit?'neg':''}">${isDebit?money(tx.amount):'—'}</td>
        <td class="n pos">${!isDebit?money(tx.amount):'—'}</td>
        <td class="n">${money(Math.max(0,run))}</td>
      </tr>`;
    }).join('');
    const periods=['all','month','lastmonth','year','custom'];
    const pLabels={all:'Dhammaan',month:'Bishaan',lastmonth:'Bishii hore',year:'Sanadka',custom:'Dooro'};
    const tabs=periods.map(p=>`<button class="chip ${period===p?'on':''}" onclick="renderAndUpdate('${p}')">${pLabels[p]}</button>`).join('');
    const customInputs=period==='custom'?`<div style="display:flex;gap:6px;align-items:center;margin-top:6px">
      <input type="date" id="stmtFrom" value="${customFrom||from}" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--surface);color:var(--ink)">
      <span style="color:var(--muted)">→</span>
      <input type="date" id="stmtTo" value="${customTo||to}" style="padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--surface);color:var(--ink)">
      <button class="chip on" onclick="renderAndUpdate('custom')">✓</button>
    </div>`:'';
    const closingBal=isCust?custBal(id):suppBal(id);
    const summaryCards=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
      <div class="panel" style="padding:10px"><div class="k">Bilowga</div><b>${money(openBal)}</b></div>
      <div class="panel" style="padding:10px"><div class="k">Dhaqdhaqaaq</div><b class="${run-openBal>0?'neg':run-openBal<0?'pos':''}">${money(run-openBal)}</b></div>
      <div class="panel" style="padding:10px"><div class="k">Xidka</div><b class="${run>0.004?'neg':''}">${money(Math.max(0,run))}</b></div>
    </div>`;
    document.getElementById('stmtBody').innerHTML=`
      <div style="margin-bottom:10px">${tabs}${customInputs}</div>
      ${summaryCards}
      <div style="margin-bottom:8px;font-size:12px;color:var(--muted)">${c.phone?`📞 ${esc(c.phone)} `:''}${c.location?`📍 ${esc(c.location)}`:''}${c.openingBal?` · 🏦 Furista: ${money(+c.openingBal)}`:''}</div>
      <div class="scroll"><table class="tbl"><thead><tr>
        <th>Taariikh</th><th>Ref</th><th>Nooca</th>
        <th class="n">Debit</th><th class="n pos">Credit</th><th class="n">Hadhay</th>
      </tr></thead><tbody>
        <tr style="background:var(--surface2)"><td colspan="5" style="font-size:12px;color:var(--muted)">Bilowga (${period==='all'?'Taariikhda furista':fdate(from)})</td><td class="n">${money(Math.max(0,openBal))}</td></tr>
        ${rows||'<tr><td colspan="6" class="empty">Cashuur ma jiro muddadan.</td></tr>'}
        <tr style="border-top:2px solid var(--brand)"><td colspan="5" style="font-weight:600">Xidka</td><td class="n ${Math.max(0,run)>0.004?'neg':''}" style="font-weight:700">${money(Math.max(0,run))}</td></tr>
      </tbody></table></div>
      ${period==='all'?`<div style="font-size:12px;color:var(--muted);margin-top:8px;text-align:right">Xidka guud: ${money(closingBal)} (${isCust?'custBal':'suppBal'})</div>`:''}`;
  }
  function renderAndUpdate(p){
    const cf=document.getElementById('stmtFrom')?.value||'';
    const ct=document.getElementById('stmtTo')?.value||'';
    if(p==='custom'&&(!cf||!ct)){renderStmt('custom',cf,ct);return;}
    renderStmt(p,cf,ct);
  }
  modal('Warbixinta: '+c.name,`<div id="stmtBody"></div>`,true);
  setTimeout(()=>{window.renderAndUpdate=renderAndUpdate;renderStmt(per,'','');},20);
}

/* ---------- Stock ---------- */
function moves(filterPid){
  const o=[];
  S.docs.forEach(d=>{
    d.lines.forEach(l=>{
      if(!l.productId)return;
      if(filterPid&&l.productId!==filterPid)return;
      if(d.type==='purchase')o.push({date:d.date,pid:l.productId,name:l.name,ref:d.no,kind:'Iibsasho',qIn:l.qty,qOut:0,cost:l.cost||0});
      if(d.type==='sale')o.push({date:d.date,pid:l.productId,name:l.name,ref:d.no,kind:'Iib',qIn:0,qOut:l.qty,cost:l.cost||0});
    });
  });
  S.returns.forEach(r=>{
    if(r.restock)r.lines.forEach(l=>{
      if(!l.productId)return;
      if(filterPid&&l.productId!==filterPid)return;
      o.push({date:r.date,pid:l.productId,name:l.name,ref:r.no,kind:'Celin iib',qIn:l.qty,qOut:0,cost:l.cost||0});
    });
  });
  (S.purchaseReturns||[]).forEach(r=>{
    (r.lines||[]).forEach(l=>{
      if(!l.productId)return;
      if(filterPid&&l.productId!==filterPid)return;
      o.push({date:r.date,pid:l.productId,name:l.name,ref:r.no||'',kind:'Celin iibsasho',qIn:0,qOut:l.qty,cost:l.cost||0});
    });
  });
  S.adjustments.forEach(a=>{
    if(filterPid&&a.productId!==filterPid)return;
    o.push({date:a.date,pid:a.productId,name:a.name,ref:a.reason||a.note||'',kind:'Hagaajin',qIn:a.delta>0?a.delta:0,qOut:a.delta<0?-a.delta:0,cost:a.cost||0});
  });
  return o.sort((a,b)=>a.date.localeCompare(b.date));
}
function vMovements(){
  const pid=F.mvPid||'';
  const allMoves=moves(pid||undefined);
  const prods=S.products;
  const prodOpts='<option value="">— Alaab dhammaan —</option>'+prods.map(p=>`<option value="${p.id}" ${pid===p.id?'selected':''}>${esc(p.name)} (hadda: ${p.stock})</option>`).join('');
  // Compute running balance
  const openings={};
  prods.forEach(p=>{const net=moves(p.id).reduce((t,m)=>t+m.qIn-m.qOut,0);openings[p.id]=p.stock-net;});
  const bals={...openings};
  const rowsData=allMoves.slice(0,1000).map(m=>{bals[m.pid]=(bals[m.pid]||0)+m.qIn-m.qOut;return{...m,bal:bals[m.pid]};});
  return head('Dhaqdhaqaaqyada Kaydka',`<select data-chg="mvPid" style="max-width:220px">${prodOpts}</select>`)+
  `<section class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>Taariikh</th><th>Alaab</th><th>Nooca</th><th>Ref</th><th class="n">Soo galay</th><th class="n">Baxay</th><th class="n">Hantida</th></tr></thead><tbody>${
  rowsData.length?rowsData.map(m=>`<tr><td>${fdate(m.date)}</td><td>${esc(m.name)}</td><td><span class="b ${m.qIn>0?'ok':m.qOut>0?'neg':''}">${m.kind}</span></td><td class="muted">${esc(m.ref)}</td><td class="n ${m.qIn?'pos':''}">${m.qIn||'—'}</td><td class="n ${m.qOut?'neg':''}">${m.qOut||'—'}</td><td class="n">${m.bal}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Dhaqdhaqaaq ma jiro.</td></tr>'}
  </tbody></table></div></section>`;
}

function openDebtView(){
  // Registered contacts with debt
  const rows=[];
  S.contacts.filter(c=>c.type==='macmiil').forEach(c=>{
    const docs=S.docs.filter(d=>d.type==='sale'&&d.contactId===c.id&&due(d)>0.004);
    const tot=sum(docs,due);
    if(tot>0.004)rows.push({id:c.id,name:c.name,phone:c.phone||'',tot,cnt:docs.length,reg:true});
  });
  // Named non-registered customers
  const byName={};
  S.docs.filter(d=>d.type==='sale'&&!d.contactId&&d.customerName&&due(d)>0.004).forEach(d=>{
    const k=d.customerName;
    if(!byName[k])byName[k]={id:null,name:k,phone:'',tot:0,cnt:0,reg:false};
    byName[k].tot+=due(d); byName[k].cnt++;
  });
  Object.values(byName).forEach(x=>rows.push(x));
  // Anonymous walk-in
  const anon=sum(S.docs.filter(d=>d.type==='sale'&&!d.contactId&&!d.customerName&&due(d)>0.004),due);
  if(anon>0.004)rows.push({id:null,name:trStr('Macmiil socod ah'),phone:'',tot:anon,cnt:0,reg:false,anon:true});
  rows.sort((a,b)=>b.tot-a.tot);
  if(!rows.length){modal(trStr('Lacagta la sugayo'),`<div class="empty">Macmiil deyn leh ma jiro.</div>`);return}
  const total_debt=sum(rows,r=>r.tot);
  modal(trStr('Lacagta la sugayo'),`<div class="scroll"><table class="tbl">
    <thead><tr><th>#</th><th>${trStr('Macmiil')}</th><th class="n">${trStr('Deyn')}</th><th class="n">%</th><th></th></tr></thead>
    <tbody>${rows.map(({id,name,phone,tot,cnt,reg,anon},i)=>{
      const pct=(tot/total_debt*100).toFixed(0);
      const overD=reg&&id&&S.contacts.find(x=>x.id===id)?.damiin?tot>S.contacts.find(x=>x.id===id)?.damiin:false;
      const loc=reg&&id?S.contacts.find(x=>x.id===id)?.location||'':'';
      const bar=`<div style="height:4px;border-radius:2px;background:var(--neg);opacity:.7;width:${pct}%;min-width:4px;margin-top:3px"></div>`;
      return `<tr><td class="muted">${i+1}</td><td><b>${esc(name)}</b>${phone?`<div class="s muted">${esc(phone)}</div>`:''} ${loc?`<div class="s muted">📍${esc(loc)}</div>`:''} ${overD?'<span class="b due" style="font-size:10px">Xad ka dhaafay</span>':''} ${bar}</td><td class="n neg"><b>${money(tot)}</b></td><td class="n muted">${pct}%</td><td>${reg&&id?`<button class="btn ghost sm" data-act="stmt" data-id="${id}">${trStr('Warbixin')}</button>`:''}</td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td colspan="2" style="font-weight:600">${trStr('Wadarta')}</td><td class="n neg" style="font-weight:700">${money(total_debt)}</td><td colspan="2"></td></tr></tfoot>
  </table></div>`);
}

/* ===== REAL-TIME CLOUD SYNC ===== */
let _dbDoc=null, _lastCloudSave=0, _syncTimer=null, _cloudSaveTimer=null;

function showSyncStatus(msg,cls,ms=2500){
  const el=document.getElementById('sync-status');
  if(!el)return;
  el.textContent=msg;el.className='show '+cls;
  clearTimeout(_syncTimer);
  if(ms>0)_syncTimer=setTimeout(()=>el.classList.remove('show'),ms);
}

async function initCloudSync(){
  try{
    const [dbCap,userCap]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!dbCap){showSyncStatus('Sync ma shaqayso','err',4000);return;}
    if(!userCap){showSyncStatus('Gal account-kaaga','err',4000);return;}
    const uid=await userCap.id();
    if(!uid){showSyncStatus('Account la\u2019aan sync ma jiro','err',4000);return;}
    // path: data/users/<uid>/xisaab = 4 segments = document
    _dbDoc=dbCap.doc('data/users/'+uid+'/xisaab');
    // Load from cloud on startup
    try{
      const snap=await _dbDoc.get();
      if(snap.exists){
        const d=snap.data();
        const remoteT=+(d.updatedAt||0);
        const localT=+(S._updatedAt||0);
        if(remoteT>localT){
          S=Object.assign(blank(),JSON.parse(d.payload));
          S._updatedAt=remoteT;
          try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
          render();
          showSyncStatus('\u2713 Xogta cloud-ka ayaa la helay','ok',3000);
        }else{
          showSyncStatus('\u2713 Xog cusboonaysiiyay','ok',2000);
        }
      }else{
        // First time on this device - push local data to cloud
        if(S.docs&&S.docs.length>0){
          const ts=Date.now();_lastCloudSave=ts;S._updatedAt=ts;
          await _dbDoc.set({payload:JSON.stringify(S),updatedAt:ts});
          showSyncStatus('\u2191 Xogta cloud-ka la diray','ok',2000);
        }
      }
    }catch(e){console.warn('Cloud load error:',e);}
    // Real-time listener
    _dbDoc.onSnapshot(snap=>{
      if(!snap||!snap.exists)return;
      const d=snap.data();
      const remoteT=+(d.updatedAt||0);
      // Ignore our own recent save
      if(Date.now()-_lastCloudSave<5000&&remoteT<=_lastCloudSave)return;
      if(remoteT<=(+(S._updatedAt||0)))return;
      try{
        S=Object.assign(blank(),JSON.parse(d.payload));
        S._updatedAt=remoteT;
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        render();
        showSyncStatus('\u21bb Device kale ka cusboonaysiiyay','syncing',3000);
      }catch(e){console.warn('Snapshot parse error:',e);}
    },err=>console.warn('Snapshot error:',err));
    showSyncStatus('\u2601 Sync diyaar','ok',2000);
  }catch(e){console.warn('Cloud sync init failed:',e);showSyncStatus('\u26a0 Sync bilaabi kari waaye','err',4000);}
}

// Override save to push to cloud (debounced)
const _origSave=save;
save=function(){
  _origSave();
  if(!_dbDoc)return;
  clearTimeout(_cloudSaveTimer);
  showSyncStatus('\u2191 Keydaynaya...','syncing',0);
  _cloudSaveTimer=setTimeout(()=>{
    const ts=Date.now();
    _lastCloudSave=ts;S._updatedAt=ts;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    const payload=JSON.stringify(S);
    if(payload.length>200000){showSyncStatus('\u26a0 Xogta aad bay u weyntahay','err',4000);return;}
    _dbDoc.set({payload,updatedAt:ts})
      .then(()=>showSyncStatus('\u2713 Cloud keydiyay','ok'))
      .catch(e=>{showSyncStatus('\u26a0 Sync khalad','err',5000);console.warn('Sync set error:',e);});
  },1000);
};

// Poll for claude runtime (available AFTER first script run)
let _syncCheckCount=0;
const _syncCheckIv=!FIREBASE_ENABLED&&setInterval(()=>{

/* ════════════════════════════════════════════════════════════
   PHASE 4 STEP 3 — FIRESTORE DATA LAYER & MIGRATION ENGINE
   ════════════════════════════════════════════════════════════
   Repository, converters, migration engine, reconciliation.
   localStorage remains PRIMARY — this is migration scaffolding.
   ════════════════════════════════════════════════════════════ */
const FB_SCHEMA_VERSION = 1;
const FB_MIGRATION_VERSION = 1;

/* ── CONVERTERS ────────────────────────────────────────────
   Normalize localStorage objects for Firestore.
   Firestore Timestamps never reach the accounting engine.
   ──────────────────────────────────────────────────────── */
function fbNormDate(v){
  // Accept string 'YYYY-MM-DD', Date, or Timestamp
  if(!v)return '';
  if(typeof v==='string')return v;
  if(v instanceof Date)return v.toISOString().slice(0,10);
  if(v&&typeof v.toDate==='function')return v.toDate().toISOString().slice(0,10);
  return String(v);
}
function fbNormNum(v){return isFinite(+v)?+v:0;}
function fbNormStr(v){return typeof v==='string'?v.trim():String(v??'').trim();}
function fbNormArr(v){return Array.isArray(v)?v:[];}
function fbSafeDoc(doc){
  // Convert a Firestore doc.data() into something safe for accounting
  if(!doc||!doc.data)return null;
  const d=doc.data();
  // Replace any Timestamp fields with ISO strings
  const out={...d,_fbId:doc.id};
  ['date','dueDate','createdAt','updatedAt','joinedAt'].forEach(k=>{
    if(out[k]&&typeof out[k].toDate==='function')out[k]=out[k].toDate().toISOString().slice(0,10);
  });
  return out;
}

/* ── REPOSITORY — collection reference ────────────────────*/
function fbCol(name){
  if(!_fbDb||!_fbBizId)return null;
  return _fbDb.collection('businesses').doc(_fbBizId).collection(name);
}
function fbDocRef(col,id){return fbCol(col)?.doc(id)||null;}
function fbPayCol(docId){
  if(!_fbDb||!_fbBizId)return null;
  return _fbDb.collection('businesses').doc(_fbBizId)
              .collection('docs').doc(docId).collection('payments');
}

/* ── REPOSITORY — reads ────────────────────────────────────*/
async function fbGetAll(col){

  return snap.docs.map(fbSafeDoc).filter(Boolean);
}
async function fbGetContacts(){return fbGetAll('contacts');}
async function fbGetProducts(){return fbGetAll('products');}

async function fbGetExpenses(){return fbGetAll('expenses');}
async function fbGetBanks(){return fbGetAll('banks');}
async function fbGetReturns(){return fbGetAll('returns');}
async function fbGetPurchaseReturns(){return fbGetAll('purchaseReturns');}
async function fbGetAdjustments(){return fbGetAll('adjustments');}

  const snap=await ref.get();return snap.docs.map(fbSafeDoc).filter(Boolean);
}

/* ── REPOSITORY — writes ───────────────────────────────────*/
async function fbCreate(col,id,data){

    _schemaVersion:FB_SCHEMA_VERSION,
    _migratedAt:firebase.firestore.FieldValue.serverTimestamp()
  });return true;
}

}

}

/* ── MIGRATION METADATA ────────────────────────────────────*/

/* ── RECONCILIATION SNAPSHOT ───────────────────────────────
   Builds a financial snapshot from localStorage S object.
   Uses Phase 3 accounting formulas unchanged.
   ──────────────────────────────────────────────────────── */
function fbBuildReconSnapshot(source='localStorage'){
  const docs=S.docs||[];
  const sales=docs.filter(d=>d.type==='sale');
  const purchases=docs.filter(d=>d.type==='purchase');
  const rets=S.returns||[];
  const prets=S.purchaseReturns||[];
  const exps=S.expenses||[];
  const banks=S.banks||[];
  const prods=S.products||[];
  const adjs=S.adjustments||[];
  const payments=docs.reduce((a,d)=>a+fbNormArr(d.payments).length,0);
  // Financial (Phase 3 formulas)
  const snap={
    ts:new Date().toISOString(),
    source,
    schemaVersion:FB_SCHEMA_VERSION,
    // counts
    contacts:(S.contacts||[]).length,
    customers:(S.contacts||[]).filter(c=>c.type==='macmiil').length,
    suppliers:(S.contacts||[]).filter(c=>c.type==='alaab').length,
    products:prods.length,
    docs:docs.length,
    sales:sales.length,
    purchases:purchases.length,
    payments,
    expenses:exps.length,
    returns:rets.length,
    purchaseReturns:prets.length,
    adjustments:adjs.length,
    loans:(S.loans||[]).length,
    banks:banks.length,
    audit:(S.audit||[]).length,
    // financial
    receivable:Math.round(receivable()*100)/100,
    payable:Math.round(payable()*100)/100,
    cash:Math.round(cashBalance()*100)/100,
    totalBank:Math.round(totalBankBal()*100)/100,
    salesTotal:Math.round(sum(sales,d=>total(d))*100)/100,
    purchaseTotal:Math.round(sum(purchases,d=>total(d))*100)/100,
    expenseTotal:Math.round(sum(exps,e=>e.amount)*100)/100,
    returnCredit:Math.round(sum(rets,r=>r.credit)*100)/100,
    returnRefund:Math.round(sum(rets,r=>+r.refund||0)*100)/100,
    pRetAmount:Math.round(sum(prets,r=>r.amount)*100)/100,
    totalStockValue:Math.round(sum(prods,p=>Math.max(0,p.stock)*p.cost)*100)/100,
    // per-bank balances
    bankBalances:Object.fromEntries(banks.map(b=>[b.id,Math.round(bankBalance(b.id)*100)/100]))
  };
  return snap;
}

/* ── VALIDATION ENGINE ─────────────────────────────────────*/
function fbValidate(){
  const errors=[],warnings=[];
  const ids=new Set();
  const chk=(coll,label)=>{
    (coll||[]).forEach((x,i)=>{
      if(!x.id)errors.push(`${label}[${i}]: missing id`);
      else if(ids.has(x.id))errors.push(`${label}[${i}]: duplicate id ${x.id}`);
      else ids.add(x.id);
    });
  };
  // contacts
  (S.contacts||[]).forEach((c,i)=>{
    if(!c.id)errors.push(`contact[${i}]: missing id`);
    if(!c.name?.trim())errors.push(`contact[${c.id}]: missing name`);
    if(c.type!=='macmiil'&&c.type!=='alaab')warnings.push(`contact[${c.id}]: unknown type ${c.type}`);
  });
  // products
  (S.products||[]).forEach((p,i)=>{
    if(!p.id)errors.push(`product[${i}]: missing id`);
    if(!p.name?.trim())errors.push(`product[${p.id}]: missing name`);
    if(!isFinite(p.stock))errors.push(`product[${p.id}]: non-numeric stock`);
    if(!isFinite(p.cost))warnings.push(`product[${p.id}]: non-numeric cost`);
  });
  // docs
  const contactIds=new Set((S.contacts||[]).map(c=>c.id));
  const productIds=new Set((S.products||[]).map(p=>p.id));
  (S.docs||[]).forEach((d,i)=>{
    if(!d.id)errors.push(`doc[${i}]: missing id`);
    if(!d.date)errors.push(`doc[${d.id}]: missing date`);
    if(!d.type)errors.push(`doc[${d.id}]: missing type`);
    if(!Array.isArray(d.lines)||d.lines.length===0)warnings.push(`doc[${d.id}]: no lines`);
    if(d.contactId&&!contactIds.has(d.contactId))warnings.push(`doc[${d.id}]: contact ${d.contactId} not found`);
    (d.lines||[]).forEach((l,j)=>{
      if(l.productId&&!productIds.has(l.productId))warnings.push(`doc[${d.id}] line[${j}]: product ${l.productId} not found`);
      if(!isFinite(l.qty)||l.qty<0)errors.push(`doc[${d.id}] line[${j}]: invalid qty`);
    });
    (d.payments||[]).forEach((p,j)=>{
      if(!isFinite(p.amount)||p.amount<=0)warnings.push(`doc[${d.id}] payment[${j}]: invalid amount`);
    });
  });
  // expenses
  (S.expenses||[]).forEach((e,i)=>{
    if(!e.id)errors.push(`expense[${i}]: missing id`);
    if(!isFinite(e.amount)||e.amount<=0)errors.push(`expense[${e.id}]: amount <= 0`);
    if(!e.date)warnings.push(`expense[${e.id}]: missing date`);
  });
  // returns
  const docIds=new Set((S.docs||[]).map(d=>d.id));
  (S.returns||[]).forEach((r,i)=>{
    if(!r.id)errors.push(`return[${i}]: missing id`);
    if(!r.docId||!docIds.has(r.docId))errors.push(`return[${r.id}]: original doc not found`);
  });
  (S.purchaseReturns||[]).forEach((r,i)=>{
    if(!r.id)errors.push(`pret[${i}]: missing id`);
    if(!r.docId||!docIds.has(r.docId))errors.push(`pret[${r.id}]: original doc not found`);
  });
  // banks
  (S.banks||[]).forEach((b,i)=>{
    if(!b.id)errors.push(`bank[${i}]: missing id`);
    if(!b.name?.trim())errors.push(`bank[${b.id}]: missing name`);
  });
  return{errors,warnings,valid:errors.length===0};
}

/* ── DRY RUN ───────────────────────────────────────────────*/
function fbDryRun(){
  const docs=S.docs||[];
  const totalPayments=docs.reduce((a,d)=>a+fbNormArr(d.payments).length,0);
  const validation=fbValidate();
  const snap=fbBuildReconSnapshot('dryRun');
  // Estimate writes: each collection entry = 1 write
  // payments extracted: 1 write per payment
  const writes={
    contacts:(S.contacts||[]).length,
    products:(S.products||[]).length,
    docs:docs.length,
    payments:totalPayments,
    expenses:(S.expenses||[]).length,
    returns:(S.returns||[]).length,
    purchaseReturns:(S.purchaseReturns||[]).length,
    adjustments:(S.adjustments||[]).length,
    loans:(S.loans||[]).length,
    banks:(S.banks||[]).length,
    audit:Math.min((S.audit||[]).length,2000),
    meta:1
  };
  const totalWrites=Object.values(writes).reduce((a,b)=>a+b,0);
  const batches=Math.ceil(totalWrites/400); // 400 writes per batch (safe under 500 limit)
  return{validation,writes,totalWrites,batches,snap,
    errors:validation.errors,warnings:validation.warnings};
}

/* ── DUPLICATE DETECTION ───────────────────────────────────*/
async function fbCheckDuplicates(){
  if(!FIREBASE_ENABLED||!_fbBizId){
    return{checked:false,reason:'Firebase not configured'};
  }
  const result={contacts:0,products:0,docs:0,expenses:0,banks:0};
  try{
    for(const col of ['contacts','products','docs','expenses','banks']){
      const snap=await fbCol(col).limit(1).get();
      result[col]=snap.size;
    }
    // If ANY collection has records, migration may create duplicates
    const hasDupes=Object.values(result).some(v=>v>0);
    return{checked:true,hasDupes,existing:result};
  }catch(e){return{checked:false,error:e.message};}
}

/* ── BATCH WRITER ──────────────────────────────────────────*/
async function fbBatchWrite(writes){
  // writes = [{col, id, data}] or [{col, docId, payId, data}]
  const CHUNK=400;
  let done=0,failed=0;
  for(let i=0;i<writes.length;i+=CHUNK){
    const chunk=writes.slice(i,i+CHUNK);
    const batch=_fbDb.batch();
    chunk.forEach(w=>{
      let ref;
      if(w.payId){
        // payment subcollection
        ref=_fbDb.collection('businesses').doc(_fbBizId)
                  .collection('docs').doc(w.docId)
                  .collection('payments').doc(w.payId);
      }else{
        ref=fbDocRef(w.col,w.id);
      }
      if(!ref)return;
      batch.set(ref,{...w.data,_schemaVersion:FB_SCHEMA_VERSION,
        _migratedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:false});
    });
    try{
      await batch.commit();
      done+=chunk.length;
      window._fbMigProgress=Math.round(done/writes.length*100);
      const el=document.getElementById('mig-progress');
      if(el)el.textContent=`${window._fbMigProgress}% (${done}/${writes.length})`;
    }catch(e){
      failed+=chunk.length;
      console.warn('Batch failed:',e);
      window._fbMigErrors=(window._fbMigErrors||[]); window._fbMigErrors.push(e.message);
    }
  }
  return{done,failed,total:writes.length};
}

/* ── MIGRATION RUN ─────────────────────────────────────────*/
async function fbMigrationRun(){
  if(!FIREBASE_ENABLED||!_fbBizId)return{ok:false,reason:'Firebase not configured'};
  window._fbMigErrors=[];window._fbMigProgress=0;
  // 1. Build all writes
  const writes=[];
  const ts=firebase.firestore.FieldValue.serverTimestamp;
  // contacts
  (S.contacts||[]).forEach(c=>writes.push({col:'contacts',id:c.id,data:{...c}}));
  // products
  (S.products||[]).forEach(p=>writes.push({col:'products',id:p.id,data:{...p}}));
  // docs + payments (embedded array → subcollection)
  (S.docs||[]).forEach(d=>{
    const {payments,...docRest}=d;
    writes.push({col:'docs',id:d.id,data:{...docRest,paymentCount:fbNormArr(payments).length}});
    fbNormArr(payments).forEach(p=>writes.push({col:'payments',docId:d.id,payId:p.id,data:{...p,docId:d.id}}));
  });
  // expenses
  (S.expenses||[]).forEach(e=>writes.push({col:'expenses',id:e.id,data:{...e}}));
  // banks
  (S.banks||[]).forEach(b=>writes.push({col:'banks',id:b.id,data:{...b}}));
  // returns
  (S.returns||[]).forEach(r=>writes.push({col:'returns',id:r.id,data:{...r}}));
  // purchase returns
  (S.purchaseReturns||[]).forEach(r=>writes.push({col:'purchaseReturns',id:r.id,data:{...r}}));
  // adjustments
  (S.adjustments||[]).forEach(a=>writes.push({col:'adjustments',id:a.id,data:{...a}}));
  // loans
  (S.loans||[]).forEach(l=>writes.push({col:'loans',id:l.id,data:{...l}}));
  // audit (capped at 2000)
  (S.audit||[]).slice(-2000).forEach(a=>writes.push({col:'audit',id:a.id,data:{...a}}));
  // 2. Execute batch writes
  const result=await fbBatchWrite(writes);
  // 3. Store reconciliation snapshot + migration meta
  const snap=fbBuildReconSnapshot('migration');
  await fbSetMigrationMeta({
    schemaVersion:FB_SCHEMA_VERSION,
    migrationVersion:FB_MIGRATION_VERSION,
    status:result.failed===0?'complete':'partial',
    completedAt:firebase.firestore.FieldValue.serverTimestamp(),
    counts:{...result,totalWrites:result.total},
    reconSnapshot:JSON.stringify(snap),
    source:'localStorage',
    errors:window._fbMigErrors||[]
  });
  // 4. Store settings in business doc
  await _fbDb.collection('businesses').doc(_fbBizId).update({
    settings:{...S.settings},
    seq:{...S.seq},
    migratedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  return{ok:result.failed===0,result,snap};
}

/* ── POST-MIGRATION VERIFICATION ──────────────────────────*/
async function fbMigrationVerify(){
  if(!FIREBASE_ENABLED||!_fbBizId)return{ok:false,reason:'Firebase not configured'};
  const ls=fbBuildReconSnapshot('localStorage');
  // Count records in Firestore
  const fbCounts={};
  const cols=['contacts','products','docs','expenses','banks','returns','purchaseReturns','adjustments','loans'];
  for(const col of cols){
    const snap=await fbCol(col).get();
    fbCounts[col]=snap.size;
  }
  // Count payments
  let fbPayCount=0;
  const docsSnap=await fbCol('docs').get();
  for(const doc of docsSnap.docs){
    const ps=await fbPayCol(doc.id).get();
    fbPayCount+=ps.size;
  }
  fbCounts.payments=fbPayCount;
  const mismatches=[];
  const map={contacts:'contacts',products:'products',docs:'docs',expenses:'expenses',
             banks:'banks',returns:'returns',purchaseReturns:'purchaseReturns',
             adjustments:'adjustments',loans:'loans',payments:'payments'};
  for(const [k,col] of Object.entries(map)){
    const lsVal=ls[k]??ls[col]??0;
    const fbVal=fbCounts[col]??0;
    if(lsVal!==fbVal)mismatches.push({col,ls:lsVal,fb:fbVal});
  }
  // Get stored recon snapshot from meta
  const meta=await fbGetMigrationMeta();
  const storedSnap=meta?.reconSnapshot?JSON.parse(meta.reconSnapshot):null;
  return{ok:mismatches.length===0,mismatches,fbCounts,lsCounts:ls,storedSnap};
}

/* ── LISTENER MANAGEMENT ───────────────────────────────────*/
function fbUnsubscribeAll(){
  Object.values(_fbListeners).forEach(unsub=>{try{unsub&&unsub();}catch(e){}});
  _fbListeners={};
}
function fbUnsubscribe(col){
  if(_fbListeners[col]){try{_fbListeners[col]();}catch(e){}_fbListeners[col]=null;}
}

/* ── FIRESTORE HYDRATION — load all collections into S ─────*/
async function fbHydrateFromFirestore(){
  if(!FIREBASE_ENABLED||!_fbBizId||!_fbDb)return false;
  try{
    showSyncStatus('↓ Xogta la soo qaadayo...','syncing',0);
    const cols=['contacts','products','docs','expenses','banks',
                'returns','purchaseReturns','adjustments','loans'];
    const results=await Promise.all(cols.map(c=>fbCol(c).get()));
    // Build reconstructed S
    const FS={};
    cols.forEach((c,i)=>{FS[c]=results[i].docs.map(fbSafeDoc).filter(Boolean);});
    // Reconstruct payments back into docs (for accounting engine compatibility)
    if(FS.docs&&FS.docs.length){
      await Promise.all(FS.docs.map(async d=>{
        const pSnap=await fbPayCol(d.id).get();
        d.payments=pSnap.docs.map(fbSafeDoc).filter(Boolean);
      }));
    }
    // Load business settings + seq
    const bizSnap=await _fbDb.collection('businesses').doc(_fbBizId).get();
    const bizData=bizSnap.exists?bizSnap.data():{};
    // Merge into S — preserve existing accounting behaviour
    S.contacts=FS.contacts||S.contacts||[];
    S.products=FS.products||S.products||[];
    S.docs=FS.docs||S.docs||[];
    S.expenses=FS.expenses||S.expenses||[];
    S.banks=FS.banks||S.banks||[];
    S.returns=FS.returns||S.returns||[];
    S.purchaseReturns=FS.purchaseReturns||S.purchaseReturns||[];
    S.adjustments=FS.adjustments||S.adjustments||[];
    S.loans=FS.loans||S.loans||[];
    if(bizData.settings)Object.assign(S.settings,bizData.settings);
    if(bizData.seq)Object.assign(S.seq,bizData.seq);
    // Sync audit (read from Firestore if available)
    try{
      const auditSnap=await fbCol('audit').orderBy('ts','desc').limit(500).get();
      S.audit=auditSnap.docs.map(fbSafeDoc).filter(Boolean);
    }catch(e){/* index may not exist yet */}
    showSyncStatus('✓ Xogta la soo qaaday','ok',2000);
    return true;
  }catch(e){
    console.warn('Hydration failed:',e);
    showSyncStatus('⚠ Xogta soo qaadidda la guul darreysatay','err',4000);
    return false;
  }
}

/* ── REAL-TIME LISTENERS ───────────────────────────────────*/
function fbSetupListeners(){
  if(!FIREBASE_ENABLED||!_fbBizId||!_fbDb)return;
  fbUnsubscribeAll(); // prevent duplicates
  const handleColl=(col,key,reconstructPayments=false)=>{
    fbUnsubscribe(col);
    _fbListeners[col]=fbCol(col).onSnapshot(async snap=>{
      if(_dataSource!==DS.FIRESTORE)return;
      const docs=snap.docs.map(fbSafeDoc).filter(Boolean);
      if(reconstructPayments){
        await Promise.all(docs.map(async d=>{
          if(!d.payments||d.payments.length!==d.paymentCount){
            const ps=await fbPayCol(d.id).get();
            d.payments=ps.docs.map(fbSafeDoc).filter(Boolean);
          }
        }));
      }
      S[key]=docs;
      // Save to localStorage as fallback snapshot
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      render();
    },err=>console.warn(`Listener error [${col}]:`,err));
  };
  handleColl('contacts','contacts');
  handleColl('products','products');
  handleColl('docs','docs',true);
  handleColl('expenses','expenses');
  handleColl('banks','banks');
  handleColl('returns','returns');
  handleColl('purchaseReturns','purchaseReturns');
  handleColl('adjustments','adjustments');
  handleColl('loans','loans');
}

/* ── ATOMIC STOCK UPDATE (prevents race conditions) ────────*/
async function fbAtomicStockUpdate(productId, delta, newCost=null){
  if(!FIREBASE_ENABLED||!_fbBizId||!productId||delta===0)return false;
  const ref=fbDocRef('products',productId);if(!ref)return false;
  const update={stock:firebase.firestore.FieldValue.increment(delta)};
  if(newCost!==null)update.cost=newCost;
  await ref.update(update);
  // Also update in-memory S for immediate UI consistency
  const p=S.products.find(x=>x.id===productId);
  if(p){p.stock=(p.stock||0)+delta;if(newCost!==null)p.cost=newCost;}
  return true;
}

// Atomic sale creation: doc + payments + stock decrement
async function fbWriteSale(d){
  if(!FIREBASE_ENABLED||!_fbBizId||_dataSource!==DS.FIRESTORE)return;
  try{
    const {payments,...docRest}=d;
    const batch=_fbDb.batch();
    const docRef=fbDocRef('docs',d.id);
    batch.set(docRef,{...docRest,paymentCount:(payments||[]).length,
      _schemaVersion:FB_SCHEMA_VERSION});
    (payments||[]).forEach(p=>{
      const pRef=fbPayCol(d.id).doc(p.id);
      batch.set(pRef,{...p,docId:d.id,_schemaVersion:FB_SCHEMA_VERSION});
    });
    await batch.commit();
    // Stock: use increment for concurrency safety
    for(const l of(d.lines||[])){
      if(l.productId)await fbAtomicStockUpdate(l.productId,-l.qty);
    }
    // Seq
    await _fbDb.collection('businesses').doc(_fbBizId).update({'seq.sale':S.seq.sale});
  }catch(e){console.warn('fbWriteSale:',e);}
}
async function fbWritePurchase(d){
  if(!FIREBASE_ENABLED||!_fbBizId||_dataSource!==DS.FIRESTORE)return;
  try{
    const {payments,...docRest}=d;
    const batch=_fbDb.batch();
    const docRef=fbDocRef('docs',d.id);
    batch.set(docRef,{...docRest,paymentCount:(payments||[]).length,
      _schemaVersion:FB_SCHEMA_VERSION});
    (payments||[]).forEach(p=>{
      const pRef=fbPayCol(d.id).doc(p.id);
      batch.set(pRef,{...p,docId:d.id,_schemaVersion:FB_SCHEMA_VERSION});
    });
    await batch.commit();
    for(const l of(d.lines||[])){
      if(l.productId)await fbAtomicStockUpdate(l.productId,+l.qty,l.price||null);
    }
    await _fbDb.collection('businesses').doc(_fbBizId).update({'seq.purchase':S.seq.purchase});
  }catch(e){console.warn('fbWritePurchase:',e);}
}
